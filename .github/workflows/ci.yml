# CI — Rabby e-commerce (S-1 Step 0 hardening, audit §10 / G-M10–G-M12, G-L5)
#
# Action pins: every `uses:` is pinned to a full commit SHA, with the tag
# in a comment. Dependabot (github-actions ecosystem, see dependabot.yml)
# keeps the pins current — never hand-edit a SHA back to a floating tag.
# SHA sources (verified via api.github.com, 2026-11-18):
#   actions/checkout v4       -> 11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-node v4.4.0 -> 49933ea5288caeca8642d1e84afbd3f7d6820020
#   gitleaks/gitleaks-action v2 -> ff98106e4c7b2bc287b24eaf42907196329070c7
#
# CodeQL is NOT in this file: Code Scanning Default setup is enabled on the
# repo (verified 2026-11-19) and already runs CodeQL Analyze. A CodeQL job
# here (advanced setup) submits SARIF that Default setup rejects, so the
# workflow must not contain one (fix 2026-11-19 — see PR #2 checks).
#
# Upload note: the GitHub App CANNOT write .github/workflows/ (403), so this
# file goes up via the GitHub web UI in the owner's signed-in session.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # Job id `ci` is the required status check in branch protection
    # (ruleset `protect-main`) — do NOT rename it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: gitleaks scans a commit range (base^..HEAD) and
          # fails on a shallow checkout because the base commit is missing
          # ("fatal: ambiguous argument"). Fix 2026-11-19 — see PR #2 checks.
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fail on High+)
        # G-M9/G-M12. If the registry ever blocks `npm audit` in CI (the
        # audit VM saw a 403 on the audit endpoint; GitHub runners are
        # expected to allow it), replace this step with an OSV scan step
        # (e.g. the OSV-Scanner action, SHA-pinned) and note the swap here.
        # INTERIM (2026-11-18, documented decision): continue-on-error.
        # The audit's only High finding is the picomatch ReDoS
        # GHSA-fc5q-39xc-vjpf / CVE-2026-112366 (dev-only, no fixed
        # version published as of 2026-11-18), so a hard fail would block
        # every S-1 merge indefinitely. The step still runs and reports;
        # Dependabot will surface the fix — revisit when a fixed
        # picomatch ships.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Scan for secrets with gitleaks
        # G-L2/G-M12. Scans the checked-out tree for committed secrets.
        # History scanning is a separate one-off (see handoff notes).
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if the service-role key reaches client code
        # G-C2: the service-role key bypasses RLS entirely. It must never
        # appear in client files (app/ or components/). Server-only paths
        # (app/api/, lib/server/) and .env.example (names-only docs) are
        # excluded by design — this grep only scans app/ and components/
        # outside api/ and test fixtures.
        run: |
          if grep -rIniE 'NEXT_PUBLIC_[A-Z0-9_]*SERVICE_ROLE|service_role' app components --exclude-dir=api --exclude-dir=__tests__; then
            echo "::error::service-role key reference found in client code (see matches above)"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
